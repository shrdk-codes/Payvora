<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PayVora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/img/Payvora.ico">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            overflow: hidden;
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            position: relative;
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-section {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Option 2: Logo Glow Wrapper */
        .logo-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            /* Radial glow effect */
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .logo-img {
            width: 64px;
            height: 64px;
            position: relative;
            z-index: 1;
            /* Subtle boost to the SVG colors */
            filter: brightness(1.1) contrast(1.1);
        }

        .logo-text {
            color: white;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .welcome-text {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.875rem;
            background: white;
            color: #1e293b;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .google-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .google-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
        }

        .footer-secure {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.75rem;
        }

        .spinner {
            animation: rotate 2s linear infinite;
            display: none;
            stroke: #1e293b;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>

    <div class="login-container glass-strong">
        <div class="logo-section">
            <!-- Logo with Brightness Wrapper -->
            <div class="logo-wrapper">
                <img src="../static/img/Payvora.svg" alt="PayVora" class="logo-img">
            </div>
            <h1 class="logo-text">PayVora</h1>
            <p class="welcome-text">Sign in to manage your assets</p>
        </div>

        <button id="googleLoginBtn" class="google-btn">
            <!-- Google Icon -->
            <svg id="googleIcon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            
            <!-- Loading Spinner -->
            <svg id="loadingSpinner" class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>

            <span id="btnText">Continue with Google</span>
        </button>

        <div class="footer-secure">
            <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i>
            <span>Secure SSL Encryption</span>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const loginBtn = document.getElementById('googleLoginBtn');
        const btnText = document.getElementById('btnText');
        const googleIcon = document.getElementById('googleIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');

        loginBtn.addEventListener('click', function () {
            this.disabled = true;
            
            // Hide Google logo, show spinner
            googleIcon.style.display = 'none';
            loadingSpinner.style.display = 'block';
            
            // Change text
            btnText.textContent = 'Logging in...';

            setTimeout(function () {
                // Adjusting destination to match your project structure
                window.location.href = './dashboard.html';
            }, 1500);
        });
    </script>
</body>
</html>
