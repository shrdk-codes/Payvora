<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayVora Dashboard</title>
    <link rel="icon" type="image/x-icon" href="../static/img/Payvora.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://bundle.run/buffer@6.0.3"></script>
    <script>window.Buffer = window.Buffer || buffer.Buffer;</script>

    <link rel="stylesheet" href="../static/css/dash.css">
</head>
<body>
    <!-- Mobile top bar -->
    <header class="mobile-header">
        <div class="mobile-logo">
            <img src="../static/img/Payvora.svg" alt="PayVora" class="logo-img">
            <span class="logo-text">PayVora</span>
        </div>
        <button class="icon-btn" onclick="handleLogout()" aria-label="Logout">
            <i data-lucide="log-out"></i>
        </button>
    </header>

    <div class="app-layout">
        <!-- Desktop sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../static/img/Payvora.svg" alt="PayVora" class="logo-img">
                <span class="logo-text">PayVora</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" onclick="connectWallet()">
                    <i data-lucide="wallet"></i>
                    <span>Connect Phantom</span>
                </div>
                <div class="nav-item" onclick="handleLogout()">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Dashboard</h2>
                <p class="page-subtitle">Welcome to your PayVora workspace</p>
            </div>

            <div class="dashboard-grid">
                <!-- Balance Card -->
                <div class="card balance-card">
                    <div class="card-label">
                        <i data-lucide="coins"></i>
                        <span>Total SOL Balance</span>
                    </div>
                    <h1 class="balance-amount" id="solBalance">0.0000</h1>
                    <div class="wallet-info">
                        <p id="walletAddr" class="wallet-addr">Not Connected</p>
                        <p id="solNetwork" class="network-badge">Devnet</p>
                    </div>
                    <button class="btn-primary connect-btn" onclick="connectWallet()">
                        <i data-lucide="wallet"></i>
                        Connect Phantom
                    </button>
                </div>

                <!-- AI Assistant Card -->
                <div class="card ai-card">
                    <div class="card-header">
                        <i data-lucide="sparkles"></i>
                        <h3>PayVora AI Assistant</h3>
                    </div>
                    <div id="aiChat" class="chat-container">
                        <p class="chat-placeholder">Ready to analyze your wallet...</p>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="aiInput" placeholder="Ask about your assets..." autocomplete="off" aria-label="Ask AI about your assets">
                        <button onclick="askAI()" class="btn-primary ask-btn">
                            <i data-lucide="send"></i>
                            <span>Ask</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="mobile-nav">
        <div class="mobile-nav-item active">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </div>
        <div class="mobile-nav-item" onclick="connectWallet()">
            <i data-lucide="wallet"></i>
            <span>Wallet</span>
        </div>
        <div class="mobile-nav-item" onclick="handleLogout()">
            <i data-lucide="log-out"></i>
            <span>Logout</span>
        </div>
    </nav>

    <script>lucide.createIcons();</script>

    <script type="module">
        import { PayVoraAgent } from "../static/js/ai-agent.js";

        window.handleLogout = () => { window.location.href = '/templates/Start.html'; };

        // Solana Logic
        const DEVNET_ENDPOINT = solanaWeb3.clusterApiUrl('devnet');

        function setNetworkLabel(label) {
            const el = document.getElementById('solNetwork');
            if (el) el.innerText = `Network: ${label}`;
        }

        function showNetworkMismatch(expected = 'Devnet') {
            // Keep it simple: show a clear message so user knows why balance isn't showing
            setNetworkLabel(`${expected} (switch Phantom network)`);
        }

        async function isOnDevnet() {
            // Phantom injects window.solana; if it supports network/version checks they can vary by wallet version.
            // We'll do a pragmatic check: compare genesis hash via the wallet connection if available.
            try {
                // If Phantom exposes `solana.request` we can ask for the chainId-like cluster.
                // Not all versions support this; so we fall back gracefully.
                if (typeof window.solana?.request === 'function') {
                    // Some wallets implement `solana:chainId` / `wallet_getCluster`-like methods; not standardized.
                    // We'll attempt a couple and ignore failures.
                    const methodsToTry = ['getCluster', 'wallet_getCluster', 'solana_getCluster'];
                    for (const method of methodsToTry) {
                        try {
                            const res = await window.solana.request({ method });
                            if (typeof res === 'string') {
                                return res.toLowerCase().includes('devnet');
                            }
                            if (res && typeof res.cluster === 'string') {
                                return res.cluster.toLowerCase().includes('devnet');
                            }
                        } catch (e) {}
                    }
                }

                // Fallback: we cannot reliably detect cluster from the provider.
                // Return null to indicate unknown.
                return null;
            } catch (e) {
                return null;
            }
        }

        window.connectWallet = async () => {
            if (window.solana?.isPhantom) {
                const resp = await window.solana.connect();
                document.getElementById('walletAddr').innerText = resp.publicKey.toString();

                // Initialise AI Agent now that we have a wallet address
                aiAgent = new PayVoraAgent(resp.publicKey.toString());

                // Try to ensure user is on devnet; if we can't detect, we still show devnet balance via RPC.
                const onDevnet = await isOnDevnet();
                if (onDevnet === false) {
                    showNetworkMismatch('Devnet');
                    // Still attempt devnet balance (helpful if wallet is on mainnet but address exists on devnet)
                } else {
                    setNetworkLabel('Devnet');
                }

                const connection = new solanaWeb3.Connection(DEVNET_ENDPOINT);
                const balance = await connection.getBalance(resp.publicKey);
                document.getElementById('solBalance').innerText = (balance / 1e9).toFixed(4);
            } else { alert("Please install Phantom!"); }
        };

        // AI Agent Logic
        let aiAgent = null;

        // Helper: safely escape user text before injecting into innerHTML
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function appendChat(html) {
            const chat = document.getElementById('aiChat');
            // Remove placeholder on first real message
            const placeholder = chat.querySelector('.chat-placeholder');
            if (placeholder) placeholder.remove();
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        window.askAI = async () => {
            const input = document.getElementById('aiInput');
            const chat = document.getElementById('aiChat');
            const userText = input.value.trim();
            if (!userText) return;

            input.value = "";

            appendChat(`<div class="chat-msg chat-msg-user"><b>You:</b> ${escapeHtml(userText)}</div>`);

            // Require wallet connection before talking to AI
            if (!aiAgent) {
                appendChat(`<div class="chat-msg chat-msg-error">⚠️ Please connect your Phantom wallet first.</div>`);
                return;
            }

            const thinkingEl = document.createElement('div');
            thinkingEl.className = 'chat-msg chat-msg-ai thinking';
            thinkingEl.textContent = '🤖 Thinking…';
            chat.appendChild(thinkingEl);
            chat.scrollTop = chat.scrollHeight;

            try {
                const aiReply = await aiAgent.chat(userText);
                thinkingEl.remove();

                appendChat(`<div class="chat-msg chat-msg-ai"><b>AI:</b> ${escapeHtml(aiReply)}</div>`);

                // Detect structured command
                const command = aiAgent.parseCommand(aiReply);
                if (command) {
                    const badge = document.createElement('div');
                    badge.className = 'chat-msg command-badge';
                    badge.innerHTML = `⚡ Command detected: <strong>${escapeHtml(command.type)}</strong> — click below to execute`;
                    chat.appendChild(badge);

                    const confirmBtn = document.createElement('button');
                    confirmBtn.className = 'btn-primary confirm-cmd-btn';
                    confirmBtn.innerHTML = `✓ Execute <strong>${escapeHtml(command.type)}</strong>`;
                    confirmBtn.onclick = async () => {
                        confirmBtn.disabled = true;
                        confirmBtn.textContent = 'Executing…';
                        try {
                            const result = await aiAgent.executeCommand(command, window.solana);
                            let statusMsg;
                            if (result.error) {
                                statusMsg = `❌ ${escapeHtml(result.error)}`;
                            } else if (result.status === 'success') {
                                const { type, details, signature, explorerUrl } = result;
                                const detailStr = details
                                    ? Object.entries(details).map(([k, v]) => `${k}: ${escapeHtml(String(v))}`).join(', ')
                                    : '';
                                const txLink = explorerUrl
                                    ? ` — <a href="${escapeHtml(explorerUrl)}" target="_blank" rel="noopener" style="color:#6ee7b7;text-decoration:underline">View on Explorer ↗</a>`
                                    : (signature ? ` — tx: ${escapeHtml(signature.slice(0, 16))}…` : '');
                                statusMsg = `✅ ${escapeHtml(type)} sent${detailStr ? ` (${detailStr})` : ''}${txLink}`;
                            } else {
                                const { type, details, note } = result;
                                const detailStr = details
                                    ? Object.entries(details).map(([k, v]) => `${k}: ${escapeHtml(String(v))}`).join(', ')
                                    : '';
                                statusMsg = `⏳ ${escapeHtml(type)} queued${detailStr ? ` (${detailStr})` : ''}${note ? ` — ${escapeHtml(note)}` : ''}`;
                            }
                            const statusClass = result.error ? 'chat-msg-error' : 'chat-msg-success';
                            appendChat(`<div class="chat-msg ${statusClass}">${statusMsg}</div>`);
                        } catch (execErr) {
                            appendChat(`<div class="chat-msg chat-msg-error">❌ Execution failed: ${escapeHtml(execErr.message)}</div>`);
                        } finally {
                            confirmBtn.remove();
                            badge.remove();
                        }
                    };
                    chat.appendChild(confirmBtn);
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                thinkingEl.remove();
                appendChat(`<div class="chat-msg chat-msg-error">❌ AI unreachable: ${escapeHtml(err.message)}</div>`);
            }
        };

        // Allow pressing Enter to send
        document.getElementById('aiInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.askAI();
        });
    </script>
</body>
</html>
