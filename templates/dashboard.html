<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PayVora Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://bundle.run/buffer@6.0.3"></script>
    <script>window.Buffer = window.Buffer || buffer.Buffer;</script>

    <link rel="stylesheet" href="../static/css/dash.css">
</head>
<body>
    <div class="desktop-view">
        <aside class="sidebar">
            <div class="flex items-center gap-3 mb-10">
                <img src="../static/img/Payvora.svg" width="30">
                <span class="text-xl font-bold">PayVora</span>
            </div>
            <nav>
                <div class="nav-item active"><i data-lucide="layout-dashboard"></i>Dashboard</div>
                <div class="nav-item" onclick="connectWallet()"><i data-lucide="wallet"></i>Connect Phantom</div>
                <div class="nav-item" onclick="handleLogout()"><i data-lucide="log-out"></i>Logout</div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-grid">
                <div class="balance-card glass">
                    <p class="text-slate-400">Total SOL Balance</p>
                    <h1 class="balance-amount" id="solBalance">0.0000</h1>
                    <p id="walletAddr" class="text-xs opacity-30 truncate">Not Connected</p>
                </div>

                <div class="widget-card glass p-8">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="sparkles" class="text-indigo-500"></i>
                        <h3 class="font-bold">PayVora AI Assistant</h3>
                    </div>
                    <div id="aiChat" class="chat-container">
                        <p class="text-slate-500 italic">Ready to analyze your wallet...</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="aiInput" placeholder="Ask about your assets...">
                        <button onclick="askAI()" class="bg-indigo-600 px-6 py-2 rounded-xl font-bold hover:bg-indigo-500 transition">Ask</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>lucide.createIcons();</script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";
        import { firebaseConfig } from "../static/js/config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);

        // Auth Guard
        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'Start.html'; });
        window.handleLogout = () => signOut(auth).then(() => window.location.href = 'Start.html');

        // Solana Logic
        window.connectWallet = async () => {
            if (window.solana?.isPhantom) {
                const resp = await window.solana.connect();
                document.getElementById('walletAddr').innerText = resp.publicKey.toString();
                
                const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('devnet'));
                const balance = await connection.getBalance(resp.publicKey);
                document.getElementById('solBalance').innerText = (balance / 1e9).toFixed(4);
            } else { alert("Please install Phantom!"); }
        };

        // AI Logic
        window.askAI = async () => {
            const input = document.getElementById('aiInput');
            const chat = document.getElementById('aiChat');
            if(!input.value) return;

            const prompt = input.value;
            chat.innerHTML += `<div class="mb-2"><b>You:</b> ${prompt}</div>`;
            input.value = "";

            try {
                const getAI = httpsCallable(functions, 'getAIResponse');
                const result = await getAI({ prompt: prompt });
                chat.innerHTML += `<div class="mb-2 text-indigo-400"><b>AI:</b> ${result.data.answer}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (err) { chat.innerHTML += `<div class="text-red-500">Error: AI unreachable.</div>`; }
        };
    </script>
</body>
</html>
